[package]
name = "rs_whisper_gpt"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
whisper-rs = "0.11.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.8"
tokio = { version = "1.0", features = ["full"] }
hound = "3.5"

[build-dependencies]
flutter_rust_bridge_codegen = "=2.11.1" 
