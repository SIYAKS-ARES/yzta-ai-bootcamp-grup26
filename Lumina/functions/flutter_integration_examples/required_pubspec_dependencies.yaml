# FRONTEND EKİBİ İÇİN - pubspec.yaml'a eklenmesi gereken paketler
# Bu bağımlılıkları Flutter projenizin pubspec.yaml dosyasına ekleyin

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase packages
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.6.0
  cloud_functions: ^4.6.0
  
  # File handling
  file_picker: ^6.1.1
  path: ^1.8.3
  
  # Audio player
  just_audio: ^0.9.36
  
  # UI and utilities (isteğe bağlı)
  provider: ^6.1.1  # State management için
  intl: ^0.19.0     # Tarih formatlaması için

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# Ayrıca flutter/minSdkVersion ayarlarını kontrol edin:
# android/app/build.gradle içinde:
# android {
#   defaultConfig {
#     minSdkVersion 21  # Firebase için minimum API level
#   }
# }

# iOS için minimum deployment target:
# ios/Podfile içinde:
# platform :ios, '11.0'  # Firebase için minimum iOS version 